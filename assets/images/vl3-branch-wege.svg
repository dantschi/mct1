<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-label="Ein bedingter Sprung wählt Zieladresse oder Folgeadresse">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<rect x="320" y="40" width="360" height="85" rx="7" class="box"/>
<text x="500" y="77" class="title" text-anchor="middle">beq t0, t1, Ziel</text>
<text x="500" y="112" class="small" text-anchor="middle">PC = 0x1000</text>
<rect x="25" y="225" width="350" height="90" rx="7" class="box"/>
<text x="200" y="264" class="small" text-anchor="middle">ungleich: nicht genommen</text>
<text x="200" y="297" class="small" text-anchor="middle">PC danach = 0x1004</text>
<rect x="625" y="225" width="350" height="90" rx="7" class="box hot"/>
<text x="800" y="264" class="small" text-anchor="middle">gleich: genommen</text>
<text x="800" y="297" class="small" text-anchor="middle">PC danach = 0x1010</text>
<path d="M410 125 L410 175 L200 175 L200 225" class="line" marker-end="url(#arrow)"/>
<path d="M590 125 L590 175 L800 175 L800 225" class="flow" marker-end="url(#redarrow)"/>
<text x="25" y="350" class="small" text-anchor="start">Zieloffset +16 Byte relativ zur Branch-Instruktion · kein Ergebnisregister</text>
</svg>