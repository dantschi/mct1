<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" role="img" aria-label="Code-Schloss Zustände">
  <style>
    .n { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
    .hot { fill: #FFFFFF; stroke: #E2001A; stroke-width: 2.5; }
    .h { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; }
    .c { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; }
    .s { fill: #86868B; font-family: Inter, sans-serif; font-size: 13px; }
    .w { fill: none; stroke: #86868B; stroke-width: 1.75; }
  </style>
  <text class="h" x="16" y="28">Code-Schloss · Ereignisse, nicht Pegel</text>
  <rect class="hot" x="30" y="70" width="150" height="64" rx="32"/>
  <rect class="n" x="240" y="70" width="150" height="64" rx="32"/>
  <rect class="n" x="450" y="70" width="150" height="64" rx="32"/>
  <rect class="n" x="660" y="70" width="150" height="64" rx="32"/>
  <text class="c" x="105" y="98" text-anchor="middle">S0 gesperrt</text>
  <text class="s" x="105" y="118" text-anchor="middle">LED rot</text>
  <text class="c" x="315" y="98" text-anchor="middle">S1</text>
  <text class="s" x="315" y="118" text-anchor="middle">LED gelb</text>
  <text class="c" x="525" y="98" text-anchor="middle">S2</text>
  <text class="s" x="525" y="118" text-anchor="middle">LED blau</text>
  <text class="c" x="735" y="98" text-anchor="middle">S3 offen</text>
  <text class="s" x="735" y="118" text-anchor="middle">LED grün</text>
  <path class="w" d="M 180 102 L 240 102"/>
  <path class="w" d="M 390 102 L 450 102"/>
  <path class="w" d="M 600 102 L 660 102"/>
  <text class="s" x="210" y="92" text-anchor="middle">UP</text>
  <text class="s" x="420" y="92" text-anchor="middle">DOWN</text>
  <text class="s" x="630" y="92" text-anchor="middle">RIGHT</text>
  <text class="s" x="16" y="180">Erfolg: UP, Release, DOWN, Release, RIGHT: S0, S1, S2, S3.</text>
  <text class="s" x="16" y="204">S0-S2: falsche einzelne Code-Taste nach S0. S3 bleibt bei UP, DOWN, RIGHT offen.</text>
  <text class="s" x="16" y="228">LEFT ist der Reset dieser Lehrvariante und fuehrt aus jedem Zustand nach S0.</text>
  <text class="s" x="16" y="252">Halten und mehrere Tasten erzeugen kein neues gueltiges Ereignis.</text>
  <text class="s" x="16" y="290">Selbst gezeichnetes Lehrdiagramm. LED-Farbe gehört zum Zustand, das Ereignis zur Kante.</text>
</svg>
