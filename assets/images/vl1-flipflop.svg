<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="D-Flip-Flop mit steigender Flanke und einem gespeicherten Bit">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="320" fill="#FFFFFF"/>
<rect x="390" y="45" width="220" height="200" rx="7" class="gate"/>
<text x="500" y="150" class="title" text-anchor="middle">D-FF</text>
<text x="90" y="119" class="title" text-anchor="start">D</text>
<path d="M140 110 L390 110" class="line" marker-end="url(#arrow)"/>
<path d="M610 110 L850 110" class="line" marker-end="url(#arrow)"/>
<text x="880" y="119" class="title" text-anchor="start">Q</text>
<path d="M490 245 L500 233 L510 245" fill="none" stroke="#86868B" stroke-width="2"/>
<path d="M500 285 L500 245" class="flow" marker-end="url(#redarrow)"/>
<text x="545" y="290" class="title" text-anchor="start">CLK</text>
</svg>