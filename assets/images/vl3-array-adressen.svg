<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Fünf Wörter belegen je vier aufeinanderfolgende Byte">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="330" fill="#FFFFFF"/>
<text x="25" y="37" class="title" text-anchor="start">Lehrbasis B = 0x1000 · 32-Bit-Wörter · Index beginnt bei 0</text>
<text x="115" y="85" class="small" text-anchor="middle">Index 0</text>
<rect x="25" y="105" width="180" height="90" rx="7" class="box"/>
<text x="115" y="160" class="title" text-anchor="middle">10</text>
<text x="115" y="232" class="small" text-anchor="middle">0x1000</text>
<text x="115" y="265" class="small" text-anchor="middle">…0x1003</text>
<text x="310" y="85" class="small" text-anchor="middle">Index 1</text>
<rect x="220" y="105" width="180" height="90" rx="7" class="box"/>
<text x="310" y="160" class="title" text-anchor="middle">20</text>
<text x="310" y="232" class="small" text-anchor="middle">0x1004</text>
<text x="310" y="265" class="small" text-anchor="middle">…0x1007</text>
<text x="505" y="85" class="small" text-anchor="middle">Index 2</text>
<rect x="415" y="105" width="180" height="90" rx="7" class="box hot"/>
<text x="505" y="160" class="title" text-anchor="middle">30</text>
<text x="505" y="232" class="small" text-anchor="middle">0x1008</text>
<text x="505" y="265" class="small" text-anchor="middle">…0x100B</text>
<text x="700" y="85" class="small" text-anchor="middle">Index 3</text>
<rect x="610" y="105" width="180" height="90" rx="7" class="box"/>
<text x="700" y="160" class="title" text-anchor="middle">40</text>
<text x="700" y="232" class="small" text-anchor="middle">0x100C</text>
<text x="700" y="265" class="small" text-anchor="middle">…0x100F</text>
<text x="895" y="85" class="small" text-anchor="middle">Index 4</text>
<rect x="805" y="105" width="180" height="90" rx="7" class="box"/>
<text x="895" y="160" class="title" text-anchor="middle">50</text>
<text x="895" y="232" class="small" text-anchor="middle">0x1010</text>
<text x="895" y="265" class="small" text-anchor="middle">…0x1013</text>
<text x="25" y="315" class="small" text-anchor="start">Werte in den Boxen · Bytebereiche darunter · kein Abstand zwischen Wörtern</text>
</svg>