<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Rohmaske wird mit einer Freigabe zu einem Ereignis">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="340" fill="#FFFFFF"/>
<rect x="20" y="105" width="200" height="110" rx="7" class="box"/>
<text x="120" y="150" class="title" text-anchor="middle">Rohmaske</text>
<text x="120" y="191" class="" text-anchor="middle">0 … 15</text>
<rect x="320" y="85" width="270" height="150" rx="7" class="box"/>
<text x="455" y="130" class="title" text-anchor="middle">Freigabe</text>
<text x="455" y="171" class="" text-anchor="middle">Einzelmaske?</text>
<text x="455" y="211" class="small" text-anchor="middle">Gruppe verbrauchen</text>
<rect x="710" y="100" width="270" height="120" rx="7" class="box"/>
<text x="845" y="143" class="title" text-anchor="middle">Ereignis</text>
<text x="845" y="182" class="" text-anchor="middle">0, 1, 2, 3, 4</text>
<path d="M220 160 L320 160" class="flow" marker-end="url(#redarrow)"/>
<path d="M590 160 L710 160" class="flow" marker-end="url(#redarrow)"/>
<text x="500" y="41" class="small" text-anchor="middle">Maske 0 gibt frei; jede nächste Nichtnullmaske sperrt.</text>
<text x="500" y="285" class="small" text-anchor="middle">Einzelmasken: 1 → UP, 2 → DOWN, 8 → RIGHT, 4 → RESET</text>
<text x="500" y="325" class="small" text-anchor="middle">Mehrfachmaske oder gesperrt: Ereignis 0</text>
</svg>