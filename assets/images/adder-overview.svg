<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" viewBox="0 0 540 220" role="img">
  <style>
.gate { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
  .wire { fill: none; stroke: #86868B; stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter; }
  .bubble { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
  .lbl { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 500; }
  .sym { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 20px; font-weight: 600; }
  .accent { stroke: #E2001A; }
  .pin { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 14px; }
  </style>
  <text class="pin" x="40" y="100" text-anchor="start">Zahl 1</text>
  <text class="pin" x="40" y="150" text-anchor="start">Zahl 2</text>
  <path class="wire" d="M 110 96 L 220 96"/>
  <path class="wire" d="M 110 146 L 220 146"/>
  <rect class="gate accent" x="220" y="70" width="100" height="100" rx="4" ry="4"/>
  <text class="sym" x="270.0" y="127.0" text-anchor="middle">+</text>
  <path class="wire" d="M 320 100 L 420 100"/>
  <path class="wire" d="M 412 95 L 420 100 L 412 105" fill="none"/>
  <text class="pin" x="435" y="104" text-anchor="start">Summe</text>
  <path class="wire" d="M 320 140 L 420 140"/>
  <path class="wire" d="M 412 135 L 420 140 L 412 145" fill="none"/>
  <text class="pin" x="435" y="144" text-anchor="start">Carry</text>

</svg>
