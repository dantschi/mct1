<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Byte-Reihenfolge von 0x12345678">
  <style>
    .box { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
    .hot { fill: #FFFFFF; stroke: #E2001A; stroke-width: 2; }
    .h { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; }
    .c { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 18px; font-weight: 600; }
    .s { fill: #86868B; font-family: Inter, sans-serif; font-size: 13px; }
  </style>
  <text class="h" x="20" y="28">Wert 0x12345678 · vier Bytezellen · Kurs: Little Endian</text>
  <text class="s" x="20" y="52">Alignment (Vielfache der Zugriffsbreite) ist ein anderes Konzept, Einheit 3.</text>
  <text class="h" x="20" y="92">Little Endian</text>
  <text class="h" x="480" y="92">Big Endian</text>
  <g id="le">
    <rect class="hot" x="20" y="108" width="90" height="64"/>
    <rect class="box" x="110" y="108" width="90" height="64"/>
    <rect class="box" x="200" y="108" width="90" height="64"/>
    <rect class="box" x="290" y="108" width="90" height="64"/>
    <text class="c" x="65" y="146" text-anchor="middle">78</text>
    <text class="c" x="155" y="146" text-anchor="middle">56</text>
    <text class="c" x="245" y="146" text-anchor="middle">34</text>
    <text class="c" x="335" y="146" text-anchor="middle">12</text>
    <text class="s" x="65" y="192" text-anchor="middle">+0 LSB</text>
    <text class="s" x="155" y="192" text-anchor="middle">+1</text>
    <text class="s" x="245" y="192" text-anchor="middle">+2</text>
    <text class="s" x="335" y="192" text-anchor="middle">+3 MSB</text>
  </g>
  <g id="be">
    <rect class="hot" x="480" y="108" width="90" height="64"/>
    <rect class="box" x="570" y="108" width="90" height="64"/>
    <rect class="box" x="660" y="108" width="90" height="64"/>
    <rect class="box" x="750" y="108" width="90" height="64"/>
    <text class="c" x="525" y="146" text-anchor="middle">12</text>
    <text class="c" x="615" y="146" text-anchor="middle">34</text>
    <text class="c" x="705" y="146" text-anchor="middle">56</text>
    <text class="c" x="795" y="146" text-anchor="middle">78</text>
    <text class="s" x="525" y="192" text-anchor="middle">+0 MSB</text>
    <text class="s" x="615" y="192" text-anchor="middle">+1</text>
    <text class="s" x="705" y="192" text-anchor="middle">+2</text>
    <text class="s" x="795" y="192" text-anchor="middle">+3 LSB</text>
  </g>
  <text class="s" x="20" y="250">Der Zeiger bezeichnet die erste adressierte Stelle. Bei Little Endian liegt dort das niederwertigste Byte.</text>
</svg>
