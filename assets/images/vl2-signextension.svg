</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="340" fill="#FFFFFF"/>
<text x="25" y="35" class="title" text-anchor="start">Bit 11 bestimmt die zwanzig neuen oberen Bits</text>
<text x="25" y="122" class="" text-anchor="start">0x005: +5</text>
<rect x="370" y="80" width="340" height="70" rx="7" class="box"/>
