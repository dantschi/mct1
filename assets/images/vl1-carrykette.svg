<path d="M410 200 L410 245" class="line" marker-end="url(#arrow)"/>
<text x="410" y="280" class="title" text-anchor="middle">S1</text>
<path d="M485 155 L560 155" class="flow" marker-end="url(#redarrow)"/>
<text x="520" y="138" class="small" text-anchor="middle">C2</text>
<rect x="560" y="100" width="150" height="100" rx="7" class="box"/>
