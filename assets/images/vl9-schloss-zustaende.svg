<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Code-Schloss: Erfolgsfolge und LEFT-Rücksetzen">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<circle cx="100" cy="95" r="47" class="box"/>
<text x="100" y="103" class="title" text-anchor="middle">S0</text>
<text x="100" y="33" class="" text-anchor="middle">Rot</text>
<path d="M147 95 L308 95" class="flow" marker-end="url(#redarrow)"/>
<text x="228" y="72" class="title" text-anchor="middle">UP</text>
<circle cx="355" cy="95" r="47" class="box"/>
<text x="355" y="103" class="title" text-anchor="middle">S1</text>
<text x="355" y="33" class="" text-anchor="middle">Gelb</text>
<path d="M402 95 L563 95" class="flow" marker-end="url(#redarrow)"/>
<text x="483" y="72" class="title" text-anchor="middle">DOWN</text>
<circle cx="610" cy="95" r="47" class="box"/>
<text x="610" y="103" class="title" text-anchor="middle">S2</text>
<text x="610" y="33" class="" text-anchor="middle">Blau</text>
<path d="M657 95 L818 95" class="flow" marker-end="url(#redarrow)"/>
<text x="738" y="72" class="title" text-anchor="middle">RIGHT</text>
<circle cx="865" cy="95" r="47" class="box"/>
<text x="865" y="103" class="title" text-anchor="middle">S3</text>
<text x="865" y="33" class="" text-anchor="middle">Grün</text>
<path d="M355 142 L355 240" class="line"/>
<circle cx="355" cy="240" r="4" fill="#86868B"/>
<path d="M610 142 L610 240" class="line"/>
<circle cx="610" cy="240" r="4" fill="#86868B"/>
<path d="M865 142 L865 240" class="line"/>
<circle cx="865" cy="240" r="4" fill="#86868B"/>
<path d="M865 240 L100 240 L100 142" class="line" marker-end="url(#arrow)"/>
<text x="520" y="280" class="title" text-anchor="middle">LEFT: jeder Zustand → S0</text>
<text x="500" y="326" class="small" text-anchor="middle">S0 mit LEFT bleibt S0; übrige Fälle stehen in der Tabelle.</text>
</svg>