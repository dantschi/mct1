<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Nach drei Iterationen sind drei Werte verarbeitet und der Zeiger steht am vierten">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="330" fill="#FFFFFF"/>
<text x="25" y="35" class="title" text-anchor="start">Lehrzustand am Schleifenkopf: i = 3 · Summe = 60</text>
<rect x="25" y="105" width="180" height="80" rx="7" class="box"/>
<text x="115" y="155" class="title" text-anchor="middle">10</text>
<text x="115" y="224" class="small" text-anchor="middle">B + 0</text>
<rect x="220" y="105" width="180" height="80" rx="7" class="box"/>
<text x="310" y="155" class="title" text-anchor="middle">20</text>
<text x="310" y="224" class="small" text-anchor="middle">B + 4</text>
<rect x="415" y="105" width="180" height="80" rx="7" class="box"/>
<text x="505" y="155" class="title" text-anchor="middle">30</text>
<text x="505" y="224" class="small" text-anchor="middle">B + 8</text>
<rect x="610" y="105" width="180" height="80" rx="7" class="box hot"/>
<text x="700" y="155" class="title" text-anchor="middle">40</text>
<text x="700" y="224" class="small" text-anchor="middle">B + 12</text>
<rect x="805" y="105" width="180" height="80" rx="7" class="box"/>
<text x="895" y="155" class="title" text-anchor="middle">50</text>
<text x="895" y="224" class="small" text-anchor="middle">B + 16</text>
<path d="M25 85 L595 85" class="line"/>
<text x="310" y="72" class="small" text-anchor="middle">bereits verarbeitet</text>
<path d="M780 280 L780 185" class="flow" marker-end="url(#redarrow)"/>
<text x="25" y="320" class="small" text-anchor="start">s1 = B + 12 zeigt auf das nächste, noch nicht gelesene Element</text>
</svg>