<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Arrayadressen mit vier Byte pro Element">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="320" fill="#FFFFFF"/>
<rect x="20" y="75" width="150" height="90" rx="7" class="box"/>
<text x="95" y="115" class="title" text-anchor="middle">p[0]</text>
<text x="95" y="150" class="" text-anchor="middle">10</text>
<text x="95" y="209" class="small" text-anchor="middle">0x2000</text>
<rect x="180" y="75" width="150" height="90" rx="7" class="box"/>
<text x="255" y="115" class="title" text-anchor="middle">p[1]</text>
<text x="255" y="150" class="" text-anchor="middle">20</text>
<text x="255" y="209" class="small" text-anchor="middle">0x2004</text>
<rect x="340" y="75" width="150" height="90" rx="7" class="box"/>
<text x="415" y="115" class="title" text-anchor="middle">p[2]</text>
<text x="415" y="150" class="" text-anchor="middle">30</text>
<text x="415" y="209" class="small" text-anchor="middle">0x2008</text>
<rect x="500" y="75" width="150" height="90" rx="7" class="box hot"/>
<text x="575" y="115" class="title" text-anchor="middle">p[3]</text>
<text x="575" y="150" class="" text-anchor="middle">40</text>
<text x="575" y="209" class="small" text-anchor="middle">0x200C</text>
<rect x="660" y="75" width="150" height="90" rx="7" class="box"/>
<text x="735" y="115" class="title" text-anchor="middle">p[4]</text>
<text x="735" y="150" class="" text-anchor="middle">50</text>
<text x="735" y="209" class="small" text-anchor="middle">0x2010</text>
<path d="M575 225 L575 260" class="flow" marker-end="url(#redarrow)"/>
<text x="575" y="303" class="title" text-anchor="middle">0x2000 + 4·3 = 0x200C</text>
<path d="M820 120 L885 120" class="line" marker-end="url(#arrow)"/>
<text x="895" y="105" class="small" text-anchor="start">0x2014</text>
<text x="895" y="142" class="small" text-anchor="start">hinter</text>
<text x="895" y="174" class="small" text-anchor="start">Array</text>
</svg>