<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="375" viewBox="0 0 1120 375" role="img" aria-labelledby="title desc"><title id="title">Zweistufige kombinatorische ALU-Steuerung</title><desc id="desc">Hauptsteuerung erkennt die Kategorie. ALUOp und relevante Funktionsbits gehen zur Detailsteuerung. Deren vier Bit wählen die Rechenoperation.</desc><style>
.box{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent{fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire{fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.control{fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.fault{fill:none;stroke:#E2001A;stroke-width:2.5;stroke-dasharray:5 4;marker-end:url(#redarrow)}
.text{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:23px}
.small{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:19px}
.caption{fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1120" height="375" fill="#FFFFFF"/><rect class="box" x="20" y="62" width="195" height="76" rx="6"/><text x="117.5" y="93.0" class="text" text-anchor="middle">Opcode</text><text x="117.5" y="123.0" class="text" text-anchor="middle">7 Bit</text><polyline class="wire" points="215,100 285,100"/><rect class="accent" x="285" y="45" width="215" height="130" rx="6"/><text x="392.5" y="118.0" class="text" text-anchor="middle">Main Control</text><polyline class="wire" points="500,85 770,85"/><rect class="box" x="770" y="45" width="325" height="80" rx="6"/><text x="932.5" y="80.0" class="small" text-anchor="middle">Quellen / Freigaben</text><text x="932.5" y="106.0" class="small" text-anchor="middle">6 Ein-Bit-Signale</text><polyline class="wire" points="500,135 565,135 565,225 705,225"/><text x="620" y="250" class="small" text-anchor="middle">ALUOp: 2 Bit</text><rect class="box" x="20" y="245" width="310" height="85" rx="6"/><text x="175.0" y="280.5" class="text" text-anchor="middle">funct3, instr[30]</text><text x="175.0" y="310.5" class="text" text-anchor="middle">3 + 1 relevante Bit</text><polyline class="wire" points="330,288 705,288"/><rect class="accent" x="705" y="195" width="205" height="135" rx="6"/><text x="807.5" y="270.5" class="text" text-anchor="middle">ALU Control</text><polyline class="wire" points="910,263 1000,263"/><text x="960" y="240" class="small" text-anchor="middle">4 Bit</text><rect class="box" x="1000" y="218" width="100" height="90" rx="6"/><text x="1050.0" y="271.0" class="text" text-anchor="middle">ALU</text><text x="570" y="360" class="caption" text-anchor="middle">Unter der Voraussetzung gültig erkannter Befehle des Kurs-Subsets.</text></svg>
