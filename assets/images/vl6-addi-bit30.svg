.control{fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.fault{fill:none;stroke:#E2001A;stroke-width:2.5;stroke-dasharray:5 4;marker-end:url(#redarrow)}
.text{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:23px}
.small{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:19px}
.caption{fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style><defs>
