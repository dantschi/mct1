<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="275" viewBox="0 0 1100 275" role="img" aria-labelledby="title desc"><title id="title">Bit 30 bei addi gehört zur Konstanten</title><desc id="desc">I-Type addi t0,x0,-5: zwölf Immediate-Bits 111111111011. Instruktionsbit 30 ist rot umrandet und gehört zum Immediate, nicht zu funct7.</desc><style>
