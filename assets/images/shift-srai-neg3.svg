<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="sra von minus 3">
  <style>
    .h { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; }
    .s { fill: #86868B; font-family: Inter, sans-serif; font-size: 14px; }
    .c { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; }
  </style>
  <text class="h" x="16" y="28">8-Bit-Ausschnitt: arithmetischer Rechtsshift und C-Division</text>
  <text class="c" x="16" y="72">minus 3 = 1111 1101</text>
  <text class="c" x="16" y="104">srai um 1 = 1111 1110 = minus 2</text>
  <text class="s" x="16" y="136">Das rechte Bit faellt heraus. Links wird das Vorzeichenbit kopiert.</text>
  <text class="s" x="16" y="158">Das rundet nach minus unendlich, nicht gegen null.</text>
  <text class="c" x="16" y="196">C-Integerdivision: minus 3 / 2 = minus 1</text>
  <text class="s" x="16" y="228">Seit C99 wird gegen null gerundet. sra ist deshalb keine allgemeine C-Division.</text>
  <text class="s" x="16" y="258">RV32 arbeitet mit 32 Bit: 0xFFFFFFFD wird zu 0xFFFFFFFE.</text>
</svg>
