ect x="670" y="340" width="110" height="90" rx="6" class="box"/><text x="725.0" y="380.0" text-anchor="middle" class="small">ALU</text><text x="725.0" y="404.0" text-anchor="middle" class="small">ALUControl</text><rect x="835" y="350" width="135" height="110" rx="6" class="box"/><text x="902.5" y="388.0" text-anchor="middle" class="small">Datenspeicher</text><text x="902.5" y="412.0" text-anchor="middle" class="small">MemRead</text><text x="902.5" y="436.0" text-anchor="middle" class="small">MemWrite</text><rect x="1040" y="420" width="90" height="90" rx="6" class="accent"/><text x="1085.0" y="460.0" text-anchor="middle" class="small">MemtoReg</text><text x="1085.0" y="484.0" text-anchor="middle" class="small">MUX</text><text x="1046" y="440" text-anchor="start" class="small">0</text><text x="1046" y="484" text-anchor="start" class="small">1</text><polyline class="wire" points="1040,125 1180,125 1180,25 15,25 15,115 30,115"/><polyline class="wire" points="160,115 220,115 220,80 290,80"/><polyline class="wire" points="380,80 900,80 900,110 950,110"/><polyline class="wire" points="220,115 220,160 670,160"/><polyline class="wire" points="780,175 915,175 915,140 950,140"/><polyline class="wire" points="90,150 90,340"/><polyline class="wire" points="160,385 250,385 250,365 290,365"/><polyline class="wire" points="250,385 250,500 290,500"/><polyline class="wire" points="450,350 670,350"/><polyline class="wire" points="450,410 470,410 470,445 520,445"/><polyline class="wire" points="420,500 490,500 490,485 520,485"/><polyline class="wire" points="600,460 635,460 635,405 670,405"/><polyline class="wire" points="780,385 835,385"/><polyline class="wire" points="805,385 805,540 1000,540 1000,445 1040,445"/><polyline class="wire" points="970,405 1020,405 1020,485 1040,485"/><polyline class="wire" points="470,410 470,570 900,570 900,460"/><polyline class="wire" points="1130,465 1160,465 1160,620 430,620 430,460"/><polyline class="wire" points="350,535 350,590 640,590 640,190 670,190"/><polyline class="control" points="745,340 745,290 780,290 780,270 800,270"/><polyline class="control" points="715,250 800,250"/><polyline class="control" points="870,260 995,260 995,170"/><circle cx="220" cy="115" r="3.5" fill="#86868B"/><circle cx="250" cy="385" r="3.5" fill="#86868B"/><circle cx="470" cy="410" r="3.5" fill="#86868B"/><circle cx="805" cy="385" r="3.5" fill="#86868B"/><text x="570" y="334" text-anchor="middle" class="small">RD1</text><text x="480" y="397" text-anchor="middle" class="small">RD2</text><text x="850" y="334" text-anchor="middle" class="small">ALU-Ergebnis</text><text x="990" y="394" text-anchor="start" class="small">Read Data</text><text x="640" y="559" text-anchor="middle" class="small">RD2 → Schreibdaten</text><text x="780" y="609" text-anchor="middle" class="small">WD → Registerbank</text><text x="190" y="375" text-anchor="middle" class="small">Instr.</text><text x="650" y="233" text-anchor="start" class="small">Branch</text><text x="752" y="315" text-anchor="start" class="small">Zero</text><text x="510" y="184" text-anchor="middle" class="small">B-Byteoffset</text><text x="1055" y="116" text-anchor="start" class="small">nextPC</text><text x="615" y="649" text-anchor="middle" class="caption">Steuerwerk: Quellenwahl, ALU-Funktion und Freigaben; Taktanschlüsse nicht eingezeichnet.</text></svg>
