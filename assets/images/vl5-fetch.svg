<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">Fetch und paralleler PC-Inkrementer</title><desc id="desc">PC-Ausgang speist den Befehlsspeicher und den separaten Addierer plus vier. Der Kandidat ist noch kein gespeicherter Folgezustand.</desc><style>
.box {fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent {fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire {fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.active {fill:none;stroke:#E2001A;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#redarrow)}
.control {fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.text {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:22px}
.small {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:18px}
.caption {fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1000" height="285" fill="#FFFFFF"/><rect x="30" y="100" width="180" height="85" rx="6" class="box"/><text x="120.0" y="135.5" text-anchor="middle" class="text">PC</text><text x="120.0" y="163.5" text-anchor="middle" class="text">0x100</text><polyline class="wire" points="210,142 300,142 300,65 410,65"/><polyline class="wire" points="300,142 300,215 410,215"/><circle cx="300" cy="142" r="3.5" fill="#86868B"/><rect x="410" y="25" width="210" height="80" rx="6" class="box"/><text x="515.0" y="72.0" text-anchor="middle" class="text">Befehlsspeicher</text><rect x="410" y="175" width="210" height="80" rx="6" class="box"/><text x="515.0" y="222.0" text-anchor="middle" class="text">Addierer +4</text><polyline class="wire" points="620,65 765,65"/><rect x="765" y="25" width="210" height="80" rx="6" class="box"/><text x="870.0" y="58.0" text-anchor="middle" class="text">Instruktion</text><text x="870.0" y="86.0" text-anchor="middle" class="text">32 Bit</text><polyline class="wire" points="620,215 765,215"/><rect x="765" y="175" width="210" height="80" rx="6" class="box"/><text x="870.0" y="208.0" text-anchor="middle" class="text">Kandidat</text><text x="870.0" y="236.0" text-anchor="middle" class="text">0x104</text></svg>
