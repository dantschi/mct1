<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="425" viewBox="0 0 1120 425" role="img" aria-labelledby="title desc"><title id="title">Datenweg für sw</title><desc id="desc">sw: Register, ALUSrc, ALU, Speicher und MemtoReg auf identischer Geometrie. PC und Fetch sind hier ausgelassen. Punkte verbinden Abzweige, Kreuzungen ohne Punkt nicht.</desc><style>
.box {fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent {fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire {fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.active {fill:none;stroke:#E2001A;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#redarrow)}
.control {fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.text {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:22px}
.small {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:18px}
.caption {fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1120" height="425" fill="#FFFFFF"/><rect x="20" y="95" width="200" height="160" rx="6" class="box"/><text x="120.0" y="154.0" text-anchor="middle" class="text">Registerbank</text><text x="120.0" y="182.0" text-anchor="middle" class="text">RD1: B</text><text x="120.0" y="210.0" text-anchor="middle" class="text">RD2: 88</text><rect x="20" y="290" width="200" height="50" rx="6" class="box"/><text x="120.0" y="322.0" text-anchor="middle" class="text">ImmGen: 0</text><rect x="305" y="170" width="110" height="100" rx="6" class="accent"/><text x="360.0" y="215.0" text-anchor="middle" class="small">ALUSrc</text><text x="360.0" y="239.0" text-anchor="middle" class="small">1</text><text x="312" y="202" text-anchor="start" class="small">0</text><text x="312" y="249" text-anchor="start" class="small">1</text><rect x="490" y="95" width="140" height="150" rx="6" class="accent"/><text x="560.0" y="149.0" text-anchor="middle" class="text">ALU</text><text x="560.0" y="177.0" text-anchor="middle" class="text">ADD</text><text x="560.0" y="205.0" text-anchor="middle" class="text">B + 0</text><rect x="715" y="95" width="170" height="160" rx="6" class="box"/><text x="800.0" y="158.0" text-anchor="middle" class="small">Datenspeicher</text><text x="800.0" y="182.0" text-anchor="middle" class="small">Schreibwert: 88</text><text x="800.0" y="206.0" text-anchor="middle" class="small">Write Data</text><rect x="960" y="170" width="110" height="100" rx="6" class="accent"/><text x="1015.0" y="215.0" text-anchor="middle" class="small">MemtoReg</text><text x="1015.0" y="239.0" text-anchor="middle" class="small">X</text><text x="967" y="202" text-anchor="start" class="small">0</text><text x="967" y="249" text-anchor="start" class="small">1</text><polyline class="active" points="220,130 490,130"/><polyline class="wire" points="220,210 305,210"/><polyline class="active" points="220,315 270,315 270,250 305,250"/><polyline class="active" points="415,220 460,220 460,190 490,190"/><polyline class="active" points="630,160 715,160"/><polyline class="wire" points="665,160 665,300 920,300 920,210 960,210"/><polyline class="wire" points="885,190 940,190 940,250 960,250"/><polyline class="active" points="260,210 260,280 800,280 800,255"/><polyline class="wire" points="1070,230 1090,230 1090,350 240,350 240,275 205,275 205,255"/><circle cx="260" cy="210" r="3.5" fill="#86868B"/><circle cx="665" cy="160" r="3.5" fill="#86868B"/><text x="447" y="260" text-anchor="middle" class="small">B: 0</text><text x="600" y="378" text-anchor="middle" class="small">RegWrite = 0     MemRead = 0     MemWrite = 1</text><text x="600" y="405" text-anchor="middle" class="caption">Rot: benötigter Datenweg. Graue Quellen sind für diese Instruktion nicht gewählt.</text></svg>
