<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Arithmetisch-logische Einheit mit Operationsauswahl und Nullerkennung">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="310" fill="#FFFFFF"/>
<rect x="380" y="65" width="260" height="190" rx="7" class="box"/>
<text x="510" y="170" class="title" text-anchor="middle">ALU</text>
<text x="65" y="113" class="title" text-anchor="start">A</text>
<path d="M110 105 L380 105" class="line" marker-end="url(#arrow)"/>
<text x="65" y="218" class="title" text-anchor="start">B</text>
<path d="M110 210 L380 210" class="line" marker-end="url(#arrow)"/>
<path d="M640 125 L875 125" class="line" marker-end="url(#arrow)"/>
<text x="900" y="133" class="title" text-anchor="start">Y</text>
<path d="M640 215 L875 215" class="line" marker-end="url(#arrow)"/>
<text x="900" y="223" class="title" text-anchor="start">Z</text>
<text x="510" y="30" class="title" text-anchor="middle">Operationsauswahl</text>
<path d="M510 40 L510 65" class="flow" marker-end="url(#redarrow)"/>
</svg>