<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-label="Ein gemeinsamer Zugriffspfad und getrennte Instruktions- und Datenwege">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="405" fill="#FFFFFF"/>
<text x="30" y="32" class="title" text-anchor="start">Ein-Port-Modell</text>
<rect x="60" y="55" width="190" height="85" rx="7" class="box"/>
<text x="155" y="109" class="title" text-anchor="middle">CPU</text>
<rect x="590" y="55" width="350" height="85" rx="7" class="box"/>
<text x="765" y="109" class="title" text-anchor="middle">Gemeinsamer Speicher</text>
<path d="M250 100 L590 100" class="line" marker-end="url(#arrow)"/>
<text x="420" y="79" class="small" text-anchor="middle">Fetch und Daten</text>
<text x="30" y="202" class="title" text-anchor="start">Getrennte Wege</text>
<rect x="60" y="250" width="190" height="85" rx="7" class="box"/>
<text x="155" y="304" class="title" text-anchor="middle">CPU</text>
<rect x="590" y="215" width="350" height="70" rx="7" class="box"/>
<text x="765" y="261" class="title" text-anchor="middle">Instruktionsspeicher</text>
<rect x="590" y="320" width="350" height="70" rx="7" class="box"/>
<text x="765" y="365" class="title" text-anchor="middle">Datenspeicher</text>
<path d="M250 270 L450 270 L450 250 L590 250" class="line" marker-end="url(#arrow)"/>
<path d="M250 315 L450 315 L450 355 L590 355" class="line" marker-end="url(#arrow)"/>
</svg>