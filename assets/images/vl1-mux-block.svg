<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Multiplexer mit zwei Datenanschlüssen und getrenntem Select">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="300" fill="#FFFFFF"/>
<rect x="380" y="50" width="240" height="170" rx="7" class="box"/>
<text x="500" y="100" class="title" text-anchor="middle">MUX</text>
<text x="410" y="138" class="small" text-anchor="start">0</text>
<text x="410" y="193" class="small" text-anchor="start">1</text>
<text x="90" y="139" class="" text-anchor="start">A</text>
<path d="M135 130 L380 130" class="line" marker-end="url(#arrow)"/>
<text x="90" y="194" class="" text-anchor="start">B</text>
<path d="M135 185 L380 185" class="line" marker-end="url(#arrow)"/>
<path d="M620 157 L870 157" class="line" marker-end="url(#arrow)"/>
<text x="895" y="165" class="title" text-anchor="start">Y</text>
<text x="500" y="283" class="" text-anchor="middle">S = Select</text>
<path d="M500 250 L500 220" class="flow" marker-end="url(#redarrow)"/>
</svg>