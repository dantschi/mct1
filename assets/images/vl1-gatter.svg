<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="285" viewBox="0 0 1020 285" role="img" aria-label="Vier rechteckige Logikgatter mit Negationskreis">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1020" height="285" fill="#FFFFFF"/>
<text x="140" y="43" class="title" text-anchor="middle">AND</text>
<rect x="90" y="90" width="100" height="115" rx="7" class="gate"/>
<text x="140" y="158" class="title" text-anchor="middle">&amp;</text>
<text x="30" y="128" class="" text-anchor="start">A</text>
<path d="M55 120 L90 120" class="line"/>
<text x="30" y="183" class="" text-anchor="start">B</text>
<path d="M55 175 L90 175" class="line"/>
<path d="M190 147 L250 147" class="line" marker-end="url(#arrow)"/>
<text x="235" y="185" class="small" text-anchor="start">Y</text>
<text x="390" y="43" class="title" text-anchor="middle">OR</text>
<rect x="340" y="90" width="100" height="115" rx="7" class="gate"/>
<text x="390" y="158" class="title" text-anchor="middle">&gt;=1</text>
<text x="280" y="128" class="" text-anchor="start">A</text>
<path d="M305 120 L340 120" class="line"/>
<text x="280" y="183" class="" text-anchor="start">B</text>
<path d="M305 175 L340 175" class="line"/>
<path d="M440 147 L500 147" class="line" marker-end="url(#arrow)"/>
<text x="485" y="185" class="small" text-anchor="start">Y</text>
<text x="640" y="43" class="title" text-anchor="middle">XOR</text>
<rect x="590" y="90" width="100" height="115" rx="7" class="gate"/>
<text x="640" y="158" class="title" text-anchor="middle">=1</text>
<text x="530" y="128" class="" text-anchor="start">A</text>
<path d="M555 120 L590 120" class="line"/>
<text x="530" y="183" class="" text-anchor="start">B</text>
<path d="M555 175 L590 175" class="line"/>
<path d="M690 147 L750 147" class="line" marker-end="url(#arrow)"/>
<text x="735" y="185" class="small" text-anchor="start">Y</text>
<text x="890" y="43" class="title" text-anchor="middle">NOT</text>
<rect x="840" y="90" width="100" height="115" rx="7" class="gate"/>
<text x="890" y="158" class="title" text-anchor="middle">1</text>
<text x="780" y="155" class="" text-anchor="start">A</text>
<path d="M805 147 L840 147" class="line"/>
<circle cx="946" cy="147" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/>
<path d="M952 147 L1000 147" class="line" marker-end="url(#arrow)"/>
<text x="985" y="185" class="small" text-anchor="start">Y</text>
</svg>