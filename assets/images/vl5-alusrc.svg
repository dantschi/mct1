<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="255" viewBox="0 0 1000 255" role="img" aria-labelledby="title desc"><title id="title">Auswahl des zweiten ALU-Operanden</title><desc id="desc">RD2 an MUX-Eingang 0, Immediate an Eingang 1. Das Select-Bit ist ein Bit, Operanden sind 32 Bit.</desc><style>
.box {fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent {fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire {fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.active {fill:none;stroke:#E2001A;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#redarrow)}
.control {fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.text {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:22px}
.small {fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:18px}
.caption {fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1000" height="255" fill="#FFFFFF"/><rect x="20" y="25" width="240" height="65" rx="6" class="box"/><text x="140.0" y="64.5" text-anchor="middle" class="text">RD2: Registerwert</text><rect x="20" y="150" width="240" height="65" rx="6" class="box"/><text x="140.0" y="189.5" text-anchor="middle" class="text">ImmGen: Offset</text><rect x="440" y="60" width="160" height="130" rx="6" class="accent"/><text x="520.0" y="118.0" text-anchor="middle" class="text">MUX</text><text x="520.0" y="146.0" text-anchor="middle" class="text">ALUSrc</text><polyline class="wire" points="260,57 340,57 340,95 440,95"/><text x="450" y="91" text-anchor="start" class="small">0</text><polyline class="wire" points="260,182 340,182 340,155 440,155"/><text x="450" y="151" text-anchor="start" class="small">1</text><polyline class="wire" points="600,125 760,125"/><rect x="760" y="90" width="220" height="70" rx="6" class="box"/><text x="870.0" y="132.0" text-anchor="middle" class="text">ALU-Eingang B</text><text x="500" y="237" text-anchor="middle" class="caption">Select: 1 Bit; gewähltes Datenwort: 32 Bit</text></svg>
