<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Zwei Namen wählen dasselbe Architekturregister">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="300" fill="#FFFFFF"/>
<text x="120" y="115" class="title" text-anchor="middle">x5</text>
<text x="120" y="225" class="title" text-anchor="middle">t0</text>
<rect x="440" y="95" width="280" height="155" rx="7" class="box hot"/>
<text x="580" y="154" class="title" text-anchor="middle">ein Register</text>
<text x="580" y="207" class="title" text-anchor="middle">32 Bit Inhalt</text>
<path d="M160 105 L440 105" class="line" marker-end="url(#arrow)"/>
<path d="M160 215 L440 215" class="line" marker-end="url(#arrow)"/>
<text x="760" y="152" class="small" text-anchor="start">Nummer 5</text>
<text x="760" y="204" class="small" text-anchor="start">Alias t0</text>
<text x="30" y="285" class="small" text-anchor="start">Der Alias erzeugt keine Kopie und keine zusätzliche Speicherstelle.</text>
</svg>