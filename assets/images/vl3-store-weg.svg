<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-label="Basis und Offset bilden eine Adresse; Daten haben einen getrennten Weg">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="375" fill="#FFFFFF"/>
<rect x="25" y="65" width="210" height="80" rx="7" class="box"/>
<text x="130" y="97" class="title" text-anchor="middle">s1 = 0x1000</text>
<text x="130" y="132" class="small" text-anchor="middle">Basisadresse</text>
<rect x="360" y="65" width="180" height="80" rx="7" class="box"/>
<text x="450" y="113" class="title" text-anchor="middle">+ 12</text>
<rect x="700" y="65" width="270" height="100" rx="7" class="box"/>
<text x="835" y="104" class="small" text-anchor="middle">Speicheradresse</text>
<text x="835" y="145" class="title" text-anchor="middle">0x100C</text>
<path d="M235 105 L360 105" class="line" marker-end="url(#arrow)"/>
<path d="M540 105 L700 105" class="line" marker-end="url(#arrow)"/>
<rect x="25" y="235" width="240" height="95" rx="7" class="box hot"/>
<text x="145" y="270" class="title" text-anchor="middle">t0</text>
<text x="145" y="309" class="small" text-anchor="middle">Quelle: 42</text>
<rect x="650" y="235" width="320" height="95" rx="7" class="box"/>
<text x="810" y="270" class="small" text-anchor="middle">vier Speicherbyte</text>
<text x="810" y="309" class="title" text-anchor="middle">2A 00 00 00</text>
<path d="M265 280 L650 280" class="flow" marker-end="url(#redarrow)"/>
<path d="M835 165 L835 235" class="line"/>
<text x="25" y="363" class="small" text-anchor="start">sw t0, 12(s1): Register → Speicher</text>
</svg>