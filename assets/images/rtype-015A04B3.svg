<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-label="R-Typ add x9 x20 x21 als 0x015A04B3">
  <style>
    .b { stroke: #E5E5EA; stroke-width: 1.5; }
    .h { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; }
    .t { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; }
    .s { fill: #86868B; font-family: Inter, sans-serif; font-size: 12px; }
  </style>
  <text class="h" x="16" y="28">add x9, x20, x21 = 0x015A04B3 · R-Typ, 32 Bit</text>
  <g font-family="Inter, sans-serif">
    <rect class="b" x="16" y="48" width="196" height="70" fill="#F5F5F7"/>
    <rect class="b" x="212" y="48" width="140" height="70" fill="#FFFFFF"/>
    <rect class="b" x="352" y="48" width="140" height="70" fill="#FFFFFF"/>
    <rect class="b" x="492" y="48" width="84" height="70" fill="#FFFFFF" stroke="#E2001A" stroke-width="2"/>
    <rect class="b" x="576" y="48" width="140" height="70" fill="#FFFFFF"/>
    <rect class="b" x="716" y="48" width="196" height="70" fill="#F5F5F7"/>
    <text class="t" x="114" y="78" text-anchor="middle">funct7</text>
    <text class="t" x="282" y="78" text-anchor="middle">rs2 = 21</text>
    <text class="t" x="422" y="78" text-anchor="middle">rs1 = 20</text>
    <text class="t" x="534" y="78" text-anchor="middle">funct3</text>
    <text class="t" x="646" y="78" text-anchor="middle">rd = 9</text>
    <text class="t" x="814" y="78" text-anchor="middle">opcode</text>
    <text class="s" x="114" y="100" text-anchor="middle">0000000 · 31:25</text>
    <text class="s" x="282" y="100" text-anchor="middle">10101 · 24:20</text>
    <text class="s" x="422" y="100" text-anchor="middle">10100 · 19:15</text>
    <text class="s" x="534" y="100" text-anchor="middle">000 · 14:12</text>
    <text class="s" x="646" y="100" text-anchor="middle">01001 · 11:7</text>
    <text class="s" x="814" y="100" text-anchor="middle">0110011 · 6:0</text>
  </g>
  <text class="s" x="16" y="160">Zusammensetzung: 0000000 10101 10100 000 01001 0110011</text>
  <text class="s" x="16" y="184">Hexadezimal gruppiert: 0000 0001 0101 1010 0000 0100 1011 0011 = 0x015A04B3</text>
  <text class="s" x="16" y="208">opcode add/sub/and/or = 0110011. sub unterscheidet sich in funct7 (0100000), nicht im opcode.</text>
</svg>
