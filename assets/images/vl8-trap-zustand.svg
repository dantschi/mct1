<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-label="Zustand vor Trap, im Handler und nach mret">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:26px}
.small{font-size:22px}.state{font-size:28px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1100" height="430" fill="#FFFFFF"/>
<rect x="30" y="60" width="310" height="315" rx="7" class="box"/>
<text x="185" y="99" class="title" text-anchor="middle">Vor Eintritt</text>
<text x="48" y="137" class="state" text-anchor="start">PC 0x00400040</text>
<text x="48" y="169" class="state" text-anchor="start">Aktueller Modus M</text>
<text x="48" y="201" class="state" text-anchor="start">MIE 1 · MPIE 0</text>
<text x="48" y="233" class="state" text-anchor="start">MPP U</text>
<text x="48" y="265" class="state" text-anchor="start">t0 = 7</text>
<text x="48" y="297" class="state" text-anchor="start">mtvec = 0x100</text>
<path d="M340 215 L395 215" class="line" marker-end="url(#arrow)"/>
<rect x="395" y="60" width="310" height="315" rx="7" class="box hot"/>
<text x="550" y="99" class="title" text-anchor="middle">Im Handler</text>
<text x="413" y="137" class="state" text-anchor="start">PC 0x100</text>
<text x="413" y="169" class="state" text-anchor="start">Aktueller Modus M</text>
<text x="413" y="201" class="state" text-anchor="start">MIE 0 · MPIE 1</text>
<text x="413" y="233" class="state" text-anchor="start">MPP M</text>
<text x="413" y="265" class="state" text-anchor="start">mepc 0x00400040</text>
<text x="413" y="297" class="state" text-anchor="start">mcause 0x8000000B</text>
<text x="413" y="329" class="state" text-anchor="start">t0: Software sichert</text>
<path d="M705 215 L760 215" class="line" marker-end="url(#arrow)"/>
<rect x="760" y="60" width="310" height="315" rx="7" class="box"/>
<text x="915" y="99" class="title" text-anchor="middle">Nach mret</text>
<text x="778" y="137" class="state" text-anchor="start">PC 0x00400040</text>
<text x="778" y="169" class="state" text-anchor="start">Aktueller Modus M</text>
<text x="778" y="201" class="state" text-anchor="start">MIE 1 · MPIE 1</text>
<text x="778" y="233" class="state" text-anchor="start">MPP U</text>
<text x="778" y="265" class="state" text-anchor="start">t0 = 7 restauriert</text>
<text x="778" y="297" class="state" text-anchor="start">mepc 0x00400040</text>
<text x="25" y="414" class="small" text-anchor="start">Zustandsphasen, keine Taktskala · M/U-Modell · keine verschachtelten Traps</text>
</svg>
