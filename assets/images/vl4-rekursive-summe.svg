<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Drei aktive Rekursionsrahmen halten verschiedene n und Rückwege">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="380" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">SumDown(3) → SumDown(2) → SumDown(1) → Basisfall 0</text>
<rect x="290" y="80" width="560" height="70" rx="7" class="box"/>
<text x="570" y="109" class="title" text-anchor="middle">Frame für n = 3</text>
<text x="570" y="139" class="small" text-anchor="middle">eigener n-Wert und eigene Rückkehradresse</text>
<rect x="290" y="160" width="560" height="70" rx="7" class="box"/>
<text x="570" y="189" class="title" text-anchor="middle">Frame für n = 2</text>
<text x="570" y="219" class="small" text-anchor="middle">eigener n-Wert und eigene Rückkehradresse</text>
<rect x="290" y="240" width="560" height="70" rx="7" class="box hot"/>
<text x="570" y="269" class="title" text-anchor="middle">Frame für n = 1</text>
<text x="570" y="299" class="small" text-anchor="middle">eigener n-Wert und eigene Rückkehradresse</text>
<path d="M930 80 L930 310" class="line" marker-end="url(#arrow)"/>
<text x="25" y="365" class="small" text-anchor="start">Basisfall ohne Frame · Rückgaben 0 → 1 → 3 → 6</text>
</svg>