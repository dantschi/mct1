<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="325" viewBox="0 0 1000 325" role="img" aria-label="Signed und unsigned ordnen dasselbe Muster unterschiedlich ein">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="325" fill="#FFFFFF"/>
<text x="25" y="130" class="title" text-anchor="start">signed</text>
<rect x="190" y="90" width="300" height="75" rx="7" class="box"/>
<text x="340" y="135" class="small" text-anchor="middle">FFFFFFFF = −1</text>
<text x="530" y="138" class="title" text-anchor="middle">&lt;</text>
<rect x="580" y="90" width="395" height="75" rx="7" class="box"/>
<text x="777" y="135" class="small" text-anchor="middle">00000001 = 1</text>
<text x="25" y="260" class="title" text-anchor="start">unsigned</text>
<rect x="190" y="220" width="300" height="75" rx="7" class="box"/>
<text x="340" y="265" class="small" text-anchor="middle">00000001 = 1</text>
<text x="530" y="268" class="title" text-anchor="middle">&lt;</text>
<rect x="580" y="220" width="395" height="75" rx="7" class="box hot"/>
<text x="777" y="265" class="small" text-anchor="middle">FFFFFFFF = 4294967295</text>
<text x="25" y="36" class="title" text-anchor="start">Vergleichsart bestimmt die Ordnung, nicht das Register</text>
</svg>