<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="365" viewBox="0 0 1100 365" role="img" aria-labelledby="title desc"><title id="title">Aufgaben der Befehlsfelder</title><desc id="desc">Ein Maschinenwort versorgt verschiedene Bausteine. Je nach Format werden Registerfelder, Immediate-Bits und Operationsfelder ausgewertet.</desc><style>
.box{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent{fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire{fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.control{fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.fault{fill:none;stroke:#E2001A;stroke-width:2.5;stroke-dasharray:5 4;marker-end:url(#redarrow)}
.text{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:23px}
.small{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:19px}
.caption{fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1100" height="365" fill="#FFFFFF"/><rect class="box" x="330" y="15" width="440" height="65" rx="6"/><text x="550.0" y="55.5" class="text" text-anchor="middle">Maschinenwort (32 Bit)</text><polyline class="wire" points="550,80 550,145 160,145 160,220"/><polyline class="wire" points="550,145 550,220"/><polyline class="wire" points="550,145 940,145 940,220"/><circle cx="550" cy="145" r="4" fill="#86868B"/><text x="160" y="194" class="small" text-anchor="middle">rs1, rs2, rd</text><text x="550" y="194" class="small" text-anchor="middle">Konstantenbits</text><text x="940" y="194" class="small" text-anchor="middle">Opcode, funct3, funct7</text><rect class="box" x="25" y="220" width="270" height="85" rx="6"/><text x="160.0" y="255.5" class="text" text-anchor="middle">Registerbank</text><text x="160.0" y="285.5" class="text" text-anchor="middle">Register auswählen</text><rect class="box" x="415" y="220" width="270" height="85" rx="6"/><text x="550.0" y="255.5" class="text" text-anchor="middle">ImmGen</text><text x="550.0" y="285.5" class="text" text-anchor="middle">Konstante aufbereiten</text><rect class="accent" x="805" y="220" width="270" height="85" rx="6"/><text x="940.0" y="255.5" class="text" text-anchor="middle">Steuerung</text><text x="940.0" y="285.5" class="text" text-anchor="middle">Funktion auswählen</text><text x="550" y="345" class="caption" text-anchor="middle">Nur die im jeweiligen Format vorhandenen Felder werden entsprechend benutzt.</text></svg>
