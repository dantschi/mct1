<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-label="Stackframe mit 16 Byte Reserve und gesicherter Rücksprungadresse">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="345" fill="#FFFFFF"/>
<text x="30" y="52" class="title" text-anchor="start">vorher: sp = 0x2000</text>
<text x="30" y="125" class="" text-anchor="start">addi sp, sp, -16</text>
<text x="30" y="198" class="title" text-anchor="start">neu: sp = 0x1FF0</text>
<text x="30" y="275" class="" text-anchor="start">sw ra, 12(sp)</text>
<text x="555" y="59" class="small" text-anchor="end">0x1FF0</text>
<rect x="580" y="15" width="350" height="65" rx="7" class="box"/>
<text x="755" y="58" class="" text-anchor="middle">Reserve</text>
<text x="555" y="131" class="small" text-anchor="end">0x1FF4</text>
<rect x="580" y="87" width="350" height="65" rx="7" class="box"/>
<text x="755" y="130" class="" text-anchor="middle">Reserve</text>
<text x="555" y="203" class="small" text-anchor="end">0x1FF8</text>
<rect x="580" y="159" width="350" height="65" rx="7" class="box"/>
<text x="755" y="202" class="" text-anchor="middle">Reserve</text>
<text x="555" y="275" class="small" text-anchor="end">0x1FFC</text>
<rect x="580" y="231" width="350" height="65" rx="7" class="box hot"/>
<text x="755" y="274" class="title" text-anchor="middle">ra: vier Byte</text>
<text x="555" y="332" class="small" text-anchor="end">0x2000</text>
<text x="585" y="332" class="small" text-anchor="start">ursprüngliche Grenze</text>
</svg>