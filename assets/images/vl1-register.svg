<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-label="Register mit Datenmultiplexer und Rückführung zum Halten">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="365" fill="#FFFFFF"/>
<rect x="350" y="100" width="130" height="140" rx="7" class="gate"/>
<text x="415" y="170" class="title" text-anchor="middle">MUX</text>
<text x="360" y="135" class="small" text-anchor="start">1</text>
<text x="360" y="199" class="small" text-anchor="start">0</text>
<rect x="630" y="100" width="170" height="150" rx="7" class="gate"/>
<text x="715" y="175" class="title" text-anchor="middle">Register</text>
<text x="30" y="138" class="title" text-anchor="start">D</text>
<path d="M75 130 L350 130" class="line" marker-end="url(#arrow)"/>
<path d="M480 170 L560 170 L560 150 L630 150" class="line" marker-end="url(#arrow)"/>
<path d="M800 150 L930 150" class="line" marker-end="url(#arrow)"/>
<text x="950" y="158" class="title" text-anchor="start">Q</text>
<circle cx="875" cy="150" r="4" fill="#86868B"/>
<path d="M875 150 L875 320 L290 320 L290 190 L350 190" class="line"/>
<text x="415" y="290" class="title" text-anchor="middle">WE</text>
<path d="M415 260 L415 240" class="flow" marker-end="url(#redarrow)"/>
<path d="M705 250 L715 238 L725 250" fill="none" stroke="#86868B" stroke-width="2"/>
<path d="M715 290 L715 250" class="line" marker-end="url(#arrow)"/>
<text x="750" y="300" class="small" text-anchor="start">CLK</text>
<text x="510" y="355" class="small" text-anchor="middle">Rückführung des gespeicherten Werts</text>
</svg>