<svg xmlns="http://www.w3.org/2000/svg" width="880" height="435" viewBox="0 0 880 435" role="img" aria-labelledby="title desc"><title id="title">Erkennung des Store-Opcodes</title><desc id="desc">Die erwarteten Nullbits 6, 4, 3 und 2 werden mit IEC-Negationsgliedern invertiert. Sieben passende Bits speisen ein rechteckiges UND-Gatter. Es wird nur der Opcode erkannt, nicht die gesamte gültige sw-Instruktion.</desc><style>
.box{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent{fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire{fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.control{fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.fault{fill:none;stroke:#E2001A;stroke-width:2.5;stroke-dasharray:5 4;marker-end:url(#redarrow)}
.text{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:23px}
.small{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:19px}
.caption{fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="880" height="435" fill="#FFFFFF"/><text x="35" y="52" class="text" text-anchor="middle">o6</text><polyline class="wire" points="65,45 130,45"/><rect class="box" x="130" y="27" width="45" height="36" rx="0"/><text x="152.5" y="53.0" class="small" text-anchor="middle">1</text><circle cx="181" cy="45" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/><polyline class="wire" points="187,45 320,45"/><text x="35" y="102" class="text" text-anchor="middle">o5</text><polyline class="wire" points="65,95 320,95"/><text x="35" y="152" class="text" text-anchor="middle">o4</text><polyline class="wire" points="65,145 130,145"/><rect class="box" x="130" y="127" width="45" height="36" rx="0"/><text x="152.5" y="153.0" class="small" text-anchor="middle">1</text><circle cx="181" cy="145" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/><polyline class="wire" points="187,145 320,145"/><text x="35" y="202" class="text" text-anchor="middle">o3</text><polyline class="wire" points="65,195 130,195"/><rect class="box" x="130" y="177" width="45" height="36" rx="0"/><text x="152.5" y="203.0" class="small" text-anchor="middle">1</text><circle cx="181" cy="195" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/><polyline class="wire" points="187,195 320,195"/><text x="35" y="252" class="text" text-anchor="middle">o2</text><polyline class="wire" points="65,245 130,245"/><rect class="box" x="130" y="227" width="45" height="36" rx="0"/><text x="152.5" y="253.0" class="small" text-anchor="middle">1</text><circle cx="181" cy="245" r="6" fill="#FFFFFF" stroke="#86868B" stroke-width="2"/><polyline class="wire" points="187,245 320,245"/><text x="35" y="302" class="text" text-anchor="middle">o1</text><polyline class="wire" points="65,295 320,295"/><text x="35" y="352" class="text" text-anchor="middle">o0</text><polyline class="wire" points="65,345 320,345"/><rect class="box" x="320" y="22" width="110" height="345" rx="0"/><text x="375.0" y="202.5" class="text" text-anchor="middle">&amp;</text><polyline class="wire" points="430,195 610,195"/><rect class="accent" x="610" y="147" width="240" height="96" rx="6"/><text x="730.0" y="190.0" class="small" text-anchor="middle">Store-Opcode</text><text x="730.0" y="216.0" class="small" text-anchor="middle">S = 1 bei 0100011</text><text x="435" y="407" class="caption" text-anchor="middle">Ein-Bit-Leitungen; Wortzugriffsprüfung über funct3 nicht dargestellt.</text></svg>
