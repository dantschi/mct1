<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">Gedachter Fehler: MemWrite bei add</title><desc id="desc">Bei add t0,t1,t2 mit t1=0x2000 und t2=4 liegt die Summe 0x2004 am Speicheradressport. Ein fälschlich aktives MemWrite schreibt dort RD2=4. Das Register t0 kann trotzdem die Summe erhalten.</desc><style>
.box{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.accent{fill:#FFFFFF;stroke:#E2001A;stroke-width:2}
.wire{fill:none;stroke:#86868B;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
.control{fill:none;stroke:#86868B;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}
.fault{fill:none;stroke:#E2001A;stroke-width:2.5;stroke-dasharray:5 4;marker-end:url(#redarrow)}
.text{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:23px}
.small{fill:#1D1D1F;font-family:Inter,Arial,sans-serif;font-size:19px}
.caption{fill:#86868B;font-family:Inter,Arial,sans-serif;font-size:18px}
</style><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86868B"/></marker>
<marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#E2001A"/></marker>
</defs><rect width="1120" height="360" fill="#FFFFFF"/><rect class="box" x="20" y="50" width="210" height="70" rx="6"/><text x="125.0" y="93.0" class="text" text-anchor="middle">t1 = 0x2000</text><rect class="box" x="20" y="150" width="210" height="70" rx="6"/><text x="125.0" y="193.0" class="text" text-anchor="middle">t2 = 4</text><polyline class="wire" points="230,85 340,85"/><polyline class="wire" points="230,185 340,185"/><rect class="box" x="340" y="55" width="170" height="170" rx="6"/><text x="425.0" y="133.0" class="text" text-anchor="middle">ALU: ADD</text><text x="425.0" y="163.0" class="text" text-anchor="middle">0x2004</text><polyline class="wire" points="510,120 775,120"/><text x="645" y="145" class="small" text-anchor="middle">Adresse 0x2004</text><rect class="box" x="775" y="60" width="315" height="180" rx="6"/><text x="932.5" y="143.0" class="text" text-anchor="middle">Datenspeicher</text><text x="932.5" y="173.0" class="text" text-anchor="middle">neues Wort: 4</text><polyline class="wire" points="285,185 285,260 905,260 905,240"/><circle cx="285" cy="185" r="4" fill="#86868B"/><text x="555" y="249" class="small" text-anchor="middle">RD2 → Schreibdaten 4</text><polyline class="wire" points="560,120 560,52 580,52"/><circle cx="560" cy="120" r="4" fill="#86868B"/><rect class="box" x="580" y="25" width="185" height="55" rx="6"/><text x="672.5" y="60.5" class="small" text-anchor="middle">t0: 0x2004</text><polyline class="fault" points="1015,35 1015,60"/><text x="900" y="22" class="small" text-anchor="middle">MemWrite = 1 (falsch)</text><text x="560" y="352" class="caption" text-anchor="middle">Annahme: 0x2004 ist eine gültige, beschreibbare Wortadresse.</text></svg>
