<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Eine gültige Entwicklung von li t0, 2048 in zwei native Befehle">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="300" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">Lehrentwicklung, keine behauptete Venus-Disassembly</text>
<text x="25" y="120" class="title" text-anchor="start">li t0, 2048</text>
<rect x="410" y="80" width="550" height="80" rx="7" class="box"/>
<text x="430" y="114" class="title" text-anchor="start">lui t0, 0x1</text>
<text x="430" y="146" class="small" text-anchor="start">t0 = 0x00001000</text>
<rect x="410" y="185" width="550" height="80" rx="7" class="box hot"/>
<text x="430" y="219" class="title" text-anchor="start">addi t0, t0, −2048</text>
<text x="430" y="251" class="small" text-anchor="start">t0 = 0x00000800</text>
<path d="M260 120 L350 120 L350 225 L410 225" class="line" marker-end="url(#arrow)"/>
<path d="M350 120 L410 120" class="line" marker-end="url(#arrow)"/>
<circle cx="350" cy="120" r="4" fill="#86868B"/>
</svg>