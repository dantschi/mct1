<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="Eintrittswert, Arbeitswert und wiederhergestellter Registerwert">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">Ein Register s0, drei Zustände · Backup im gewählten Frame</text>
<rect x="25" y="90" width="300" height="160" rx="7" class="box"/>
<text x="175" y="128" class="small" text-anchor="middle">Eintritt</text>
<text x="175" y="182" class="title" text-anchor="middle">s0 = 99</text>
<text x="175" y="225" class="small" text-anchor="middle">Slot noch unbekannt</text>
<path d="M325 170 L355 170" class="line" marker-end="url(#arrow)"/>
<rect x="355" y="90" width="300" height="160" rx="7" class="box hot"/>
<text x="505" y="128" class="small" text-anchor="middle">nach Sicherung</text>
<text x="505" y="182" class="title" text-anchor="middle">s0 = 5</text>
<text x="505" y="225" class="small" text-anchor="middle">Slot = 99</text>
<path d="M655 170 L685 170" class="line" marker-end="url(#arrow)"/>
<rect x="685" y="90" width="300" height="160" rx="7" class="box"/>
<text x="835" y="128" class="small" text-anchor="middle">nach Rückkehr</text>
<text x="835" y="182" class="title" text-anchor="middle">s0 = 99</text>
<text x="835" y="225" class="small" text-anchor="middle">Frame freigegeben</text>
<text x="25" y="305" class="small" text-anchor="start">sw sichert · Rumpf verändert · lw restauriert · Freigabe löscht keine Byte</text>
</svg>