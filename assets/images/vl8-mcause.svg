<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-label="mcause trennt Interruptbit und Ursachencode">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:26px}
.small{font-size:22px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1080" height="300" fill="#FFFFFF"/>
<text x="25" y="40" class="title" text-anchor="start">mcause in RV32: 32 Bit</text>
<rect x="40" y="95" width="180" height="100" rx="7" class="box hot"/>
<text x="130" y="130" class="small" text-anchor="middle">Bit 31</text>
<text x="130" y="170" class="small" text-anchor="middle">Interrupt?</text>
<rect x="240" y="95" width="795" height="100" rx="7" class="box"/>
<text x="637" y="130" class="small" text-anchor="middle">Bits 30:0</text>
<text x="637" y="170" class="title" text-anchor="middle">Ursachencode</text>
<text x="25" y="250" class="small" text-anchor="start">0x0000000B: Exception, Code 11 · 0x8000000B: Interrupt, Code 11</text>
</svg>