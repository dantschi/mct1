<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="lb und lbu von Byte 0x80">
  <style>
    .box { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
    .hot { fill: #FFFFFF; stroke: #E2001A; stroke-width: 2; }
    .h { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600; }
    .c { fill: #1D1D1F; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; }
    .s { fill: #86868B; font-family: Inter, sans-serif; font-size: 13px; }
  </style>
  <text class="h" x="20" y="28">Dasselbe Speicherbyte 0x80, zwei 32-Bit-Registerwerte</text>
  <rect class="hot" x="20" y="50" width="120" height="56"/>
  <text class="c" x="80" y="84" text-anchor="middle">RAM 0x80</text>
  <text class="s" x="170" y="84">Bit 7 = 1</text>
  <text class="h" x="20" y="150">lb ’ 0xFFFFFF80</text>
  <text class="s" x="20" y="172">Vorzeichenerweiterung: Bit 7 in die oberen 24 Bits kopiert. Als Zweierkomplement 128.</text>
  <text class="h" x="20" y="210">lbu ’ 0x00000080</text>
  <text class="s" x="20" y="232">Nullerweiterung. Als vorzeichenlose Zahl 128. ASCII ist nur 7 Bit; 0x80 ist kein ASCII-Zeichen.</text>
</svg>
