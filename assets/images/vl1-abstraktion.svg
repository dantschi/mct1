<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Abstrakte Schnittstelle und mögliche Umsetzung mit Logik und Register">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="360" fill="#FFFFFF"/>
<text x="30" y="35" class="title" text-anchor="start">Eine Schnittstelle</text>
<rect x="350" y="50" width="300" height="110" rx="7" class="box hot"/>
<text x="500" y="95" class="title" text-anchor="middle">Rechnen +</text>
<text x="500" y="130" class="title" text-anchor="middle">speichern</text>
<path d="M100 80 L350 80" class="line" marker-end="url(#arrow)"/>
<text x="80" y="88" class="" text-anchor="end">A</text>
<path d="M100 130 L350 130" class="line" marker-end="url(#arrow)"/>
<text x="80" y="138" class="" text-anchor="end">B</text>
<path d="M650 105 L920 105" class="line" marker-end="url(#arrow)"/>
<text x="940" y="113" class="" text-anchor="start">Q</text>
<text x="30" y="215" class="title" text-anchor="start">Eine mögliche Umsetzung</text>
<rect x="260" y="250" width="200" height="70" rx="7" class="box"/>
<text x="360" y="295" class="title" text-anchor="middle">Logik</text>
<rect x="680" y="250" width="240" height="70" rx="7" class="box"/>
<text x="800" y="295" class="title" text-anchor="middle">Register</text>
<path d="M460 285 L680 285" class="line" marker-end="url(#arrow)"/>
<text x="575" y="268" class="small" text-anchor="middle">Ergebnis</text>
</svg>