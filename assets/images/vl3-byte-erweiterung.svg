<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Dasselbe Speicherbyte wird auf zwei Arten zum Registerwort erweitert">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="330" fill="#FFFFFF"/>
<text x="25" y="35" class="title" text-anchor="start">Speicherbyte 0x8F · Bit 7 = 1</text>
<text x="25" y="130" class="title" text-anchor="start">lb</text>
<rect x="150" y="85" width="430" height="70" rx="7" class="box hot"/>
<text x="365" y="130" class="title" text-anchor="middle">FFFFFF</text>
<rect x="600" y="85" width="200" height="70" rx="7" class="box"/>
<text x="700" y="130" class="title" text-anchor="middle">8F</text>
<text x="845" y="130" class="title" text-anchor="start">−113</text>
<text x="25" y="240" class="title" text-anchor="start">lbu</text>
<rect x="150" y="195" width="430" height="70" rx="7" class="box"/>
<text x="365" y="240" class="title" text-anchor="middle">000000</text>
<rect x="600" y="195" width="200" height="70" rx="7" class="box"/>
<text x="700" y="240" class="title" text-anchor="middle">8F</text>
<text x="845" y="240" class="title" text-anchor="start">143</text>
<text x="365" y="313" class="small" text-anchor="middle">24 ergänzte Bit</text>
<text x="700" y="313" class="small" text-anchor="middle">8 geladene Bit</text>
</svg>