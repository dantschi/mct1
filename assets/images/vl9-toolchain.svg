<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Werkzeugkette vom C-Text zum verknüpften Programm">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="290" fill="#FFFFFF"/>
<rect x="10" y="100" width="200" height="90" rx="7" class="box"/>
<text x="110" y="154" class="title" text-anchor="middle">Präprozessor</text>
<rect x="270" y="100" width="200" height="90" rx="7" class="box"/>
<text x="370" y="154" class="title" text-anchor="middle">Compiler</text>
<rect x="530" y="100" width="200" height="90" rx="7" class="box"/>
<text x="630" y="154" class="title" text-anchor="middle">Assembler</text>
<rect x="790" y="100" width="200" height="90" rx="7" class="box"/>
<text x="890" y="154" class="title" text-anchor="middle">Linker</text>
<text x="110" y="55" class="title" text-anchor="middle">C-Text</text>
<path d="M110 65 L110 100" class="line" marker-end="url(#arrow)"/>
<path d="M210 145 L270 145" class="line" marker-end="url(#arrow)"/>
<text x="240" y="124" class="small" text-anchor="middle">.i</text>
<path d="M470 145 L530 145" class="line" marker-end="url(#arrow)"/>
<text x="500" y="124" class="small" text-anchor="middle">.s</text>
<path d="M730 145 L790 145" class="line" marker-end="url(#arrow)"/>
<text x="760" y="124" class="small" text-anchor="middle">.o</text>
<path d="M890 190 L890 220" class="line" marker-end="url(#arrow)"/>
<text x="890" y="255" class="title" text-anchor="middle">Programm</text>
<text x="25" y="245" class="small" text-anchor="start">Text → Text → Text → Objekt → verknüpftes Programm</text>
</svg>