<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-label="bne verzweigt bei Ungleichheit zum Else-Pfad; der Then-Pfad überspringt Else">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="410" fill="#FFFFFF"/>
<rect x="320" y="35" width="360" height="75" rx="7" class="box"/>
<text x="500" y="82" class="title" text-anchor="middle">bne s0, s1, Else</text>
<rect x="25" y="180" width="350" height="90" rx="7" class="box"/>
<text x="200" y="216" class="small" text-anchor="middle">gleich: Then</text>
<text x="200" y="251" class="title" text-anchor="middle">addi t0, x0, 1</text>
<rect x="625" y="180" width="350" height="90" rx="7" class="box"/>
<text x="800" y="216" class="small" text-anchor="middle">ungleich: Else</text>
<text x="800" y="251" class="title" text-anchor="middle">addi t0, x0, 2</text>
<rect x="375" y="340" width="250" height="55" rx="7" class="box hot"/>
<text x="500" y="378" class="title" text-anchor="middle">Ende</text>
<path d="M410 110 L410 145 L200 145 L200 180" class="line" marker-end="url(#arrow)"/>
<path d="M590 110 L590 145 L800 145 L800 180" class="flow" marker-end="url(#redarrow)"/>
<path d="M200 270 L200 367 L375 367" class="line" marker-end="url(#arrow)"/>
<text x="40" y="330" class="small" text-anchor="start">j Ende</text>
<path d="M800 270 L800 367 L625 367" class="line" marker-end="url(#arrow)"/>
</svg>