<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="350" fill="#FFFFFF"/>
<rect x="25" y="55" width="320" height="65" rx="7" class="box"/>
<text x="185" y="97" class="small" text-anchor="middle">Aufruf bei 0x1000</text>
<rect x="655" y="55" width="320" height="65" rx="7" class="box"/>
<text x="815" y="97" class="small" text-anchor="middle">Fortsetzung 0x1004</text>
<rect x="25" y="240" width="320" height="65" rx="7" class="box"/>
<text x="185" y="282" class="small" text-anchor="middle">Aufruf bei 0x2000</text>
<rect x="655" y="240" width="320" height="65" rx="7" class="box"/>
<text x="815" y="282" class="small" text-anchor="middle">Fortsetzung 0x2004</text>
<rect x="395" y="145" width="210" height="65" rx="7" class="box hot"/>
<text x="500" y="187" class="title" text-anchor="middle">Funktion</text>
<path d="M345 87 L425 87 L425 145" class="line" marker-end="url(#arrow)"/>
<path d="M345 272 L425 272 L425 210" class="line" marker-end="url(#arrow)"/>
<path d="M605 167 L635 167 L635 87 L655 87" class="flow" marker-end="url(#redarrow)"/>
<path d="M605 189 L645 189 L645 272 L655 272" class="line" marker-end="url(#arrow)"/>
<text x="25" y="335" class="small" text-anchor="start">ra merkt die jeweilige Fortsetzung · ein festes Rücksprunglabel genügt nicht</text>
