<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285" role="img" aria-label="jalr löscht nur Bit null, nicht automatisch beide unteren Bits">
<style>
text{font-family:Inter,sans-serif;fill:#1D1D1F;font-size:28px}
.small{font-size:24px}.muted{fill:#86868B}.title{font-weight:600}
.box{fill:#F5F5F7;stroke:#E5E5EA;stroke-width:2}
.gate{fill:#FFFFFF;stroke:#E5E5EA;stroke-width:2}
.hot{stroke:#E2001A;stroke-width:2.5}
.line{fill:none;stroke:#86868B;stroke-width:2}
.flow{fill:none;stroke:#E2001A;stroke-width:2.5}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#86868B"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#E2001A"/></marker></defs>
<rect width="1000" height="285" fill="#FFFFFF"/>
<text x="25" y="38" class="title" text-anchor="start">jalr x0, 0(ra): Summe bilden, dann Bit 0 löschen</text>
<rect x="25" y="85" width="220" height="60" rx="7" class="box"/>
<text x="135" y="125" class="title" text-anchor="middle">0x1005</text>
<rect x="420" y="85" width="220" height="60" rx="7" class="box hot"/>
<text x="530" y="125" class="title" text-anchor="middle">0x1004</text>
<path d="M245 115 L420 115" class="line" marker-end="url(#arrow)"/>
<text x="335" y="99" class="small" text-anchor="middle">Bit 0 = 0</text>
<text x="690" y="125" class="small" text-anchor="start">durch 4 teilbar</text>
<rect x="25" y="185" width="220" height="60" rx="7" class="box"/>
<text x="135" y="225" class="title" text-anchor="middle">0x1006</text>
<rect x="420" y="185" width="220" height="60" rx="7" class="box hot"/>
<text x="530" y="225" class="title" text-anchor="middle">0x1006</text>
<path d="M245 215 L420 215" class="line" marker-end="url(#arrow)"/>
<text x="335" y="199" class="small" text-anchor="middle">Bit 0 = 0</text>
<text x="690" y="225" class="small" text-anchor="start">nicht durch 4 teilbar</text>
</svg>