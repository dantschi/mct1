project:
  type: website
  # Übungsblätter nur als PDF (separater CI-Schritt) — nicht Teil der Website-Render-Pipeline
  render:
    - "*.qmd"
    - "vorlesungen/"
    - "!labs/"

website:
  title: "Mikrocomputertechnik 1"
  description: "Vorlesung Mikrocomputertechnik 1 (MCT1) an der DHBW Stuttgart"
  site-url: https://dantschi.github.io/mct1/
  favicon: assets/dhbw_logo.svg
  # Keine Sidebar: Startseite = README-ähnlich, Folien direkt verlinkt
  navbar:
    background: light
    title: "MCT1"
    left:
      - text: "Startseite"
        href: index.qmd
      - text: "Repository"
        href: https://github.com/dantschi/mct1
  page-navigation: false
  page-footer:
    left: "MCT1 · DHBW Stuttgart"
    right: "CC BY 4.0"

format:
  # ---------------------------------------------------------------------------
  # Website (HTML) — lean, README-ähnlich
  # ---------------------------------------------------------------------------
  html:
    theme:
      - cosmo
      - assets/styles/custom.scss
    toc: false
    mainfont: Inter
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  # ---------------------------------------------------------------------------
  # Reveal.js — Vorlesungsfolien (Vortrag)
  # ---------------------------------------------------------------------------
  revealjs:
    theme:
      - simple
      - assets/styles/slides.scss
    logo: assets/dhbw_logo.svg
    slide-number: true
    chalkboard: false
    preview-links: auto
    center: false
    auto-stretch: false
    width: 1280
    height: 720
    margin: 0.08
    show-notes: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    include-after-body:
      - assets/scripts/mermaid-fit.html

  # ---------------------------------------------------------------------------
  # PDF-Artikel
  # ---------------------------------------------------------------------------
  pdf:
    documentclass: article
    papersize: a4
    geometry:
      - margin=3cm
    mainfont: TeX Gyre Heros
    sansfont: TeX Gyre Heros
    monofont: TeX Gyre Cursor
    fontsize: 11pt
    linestretch: 1.25
    colorlinks: true
    linkcolor: dhbwred
    urlcolor: dhbwred
    citecolor: dhbwred
    toc: true
    numbersections: true
    keep-tex: false
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{dhbwred}{HTML}{E2001A}
